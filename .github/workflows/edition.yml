name: edition

# ThunderFeed's heavy pipeline (fetch → cluster → embed → persist →
# snapshot) runs HERE, not in the web request: Vercel serverless reads
# the latest edition_snapshots row, and scheduled runs keep it fresh.
# Public repo → Actions minutes are free. GitHub may delay scheduled
# runs a few minutes at peak; 30-min cadence tolerates that jitter and
# leaves headroom for a slow cold build to finish before the next slot.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: # manual "rebuild now" from the Actions tab
  push:
    branches: [main]
    paths: [lib/**, db/migrations/**] # deploy-affecting changes rebuild early

# One edition build at a time: persist takes a session-level advisory
# lock, so overlapping runs would just spin on pg_try_advisory_lock.
# GitHub keeps a single pending run per group — extras coalesce.
concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Remote persist (runner → Supabase SG) is ~3-4x slower than local:
    # sequential per-cluster roundtrips at ~200ms RTT. 45 min covers a
    # cold run; steady-state rebuilds finish well under that.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build edition → Postgres
        env:
          DATABASE_URL: ${{ secrets.TF_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.TF_GEMINI_API_KEY }}
        run: npm run build:edition
      # R6.1: after each ingest pass — relineage unclassified docs to
      # effective roots, refresh entity prominence, adjudicate claims.
      # All three are INCREMENTAL (changed events since the job_runs
      # cursor) and observable (processed/failed/cursor recorded per
      # run). Order matters: lineage before adjudication so votes are
      # counted per origin, not per outlet.
      - name: Relineage unknown provenance
        env:
          DATABASE_URL: ${{ secrets.TF_DATABASE_URL }}
        run: npx tsx scripts/radar/relineage.mts --limit 200
      - name: Enrich entity prominence
        env:
          DATABASE_URL: ${{ secrets.TF_DATABASE_URL }}
        run: npx tsx scripts/radar/enrich.mts --limit 200
      - name: Adjudicate claims
        env:
          DATABASE_URL: ${{ secrets.TF_DATABASE_URL }}
        run: npx tsx scripts/radar/adjudicate.mts --events 40
      # R7.1c: the claim-materiality queue is durable but not
      # self-draining — writer/relineage/adjudicate producers above all
      # enqueue into dirty_claims; this consumer must run every cycle or
      # projections silently go stale while the workflow stays green.
      # drain-claims exits non-zero on failed>0 or pendingRemaining>0 so
      # a wedged queue fails the run instead of masking it.
      - name: Drain claim materiality
        env:
          DATABASE_URL: ${{ secrets.TF_DATABASE_URL }}
        run: npx tsx scripts/materiality/drain-claims.mts
      # Telegram alerts disabled — every-30-min pushes were spam. The
      # alerts:telegram script stays; re-enable by restoring this step
      # when delivery is redesigned as an interruption-budgeted digest.
      # - name: Telegram alerts
      #   if: always()
      #   env:
      #     DATABASE_URL: ${{ secrets.TF_DATABASE_URL }}
      #     TELEGRAM_BOT_TOKEN: ${{ secrets.TF_TELEGRAM_BOT_TOKEN }}
      #     TELEGRAM_CHAT_ID: ${{ secrets.TF_TELEGRAM_CHAT_ID }}
      #   run: npm run alerts:telegram
